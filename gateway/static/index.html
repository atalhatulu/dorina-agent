<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Dorina</title>
<style>
  :root {
    --bg: #212121;
    --surface: #171717;
    --border: #333;
    --text: #e0e0e0;
    --dim: #888;
    --accent: #d4622a;
    --accent-hover: #e5753a;
    --input-bg: #2a2a2a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg); color: var(--text);
    height: 100vh; display: flex; flex-direction: column;
    overflow: hidden;
  }

  /* ── Top bar ── */
  .topbar {
    display: flex; align-items: center; padding: 12px 20px;
    border-bottom: 1px solid var(--border); background: var(--surface);
    flex-shrink: 0;
  }
  .topbar .brand { font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .topbar .brand span { color: var(--accent); }
  .topbar .status { margin-left: auto; font-size: 12px; color: var(--dim); display: flex; align-items: center; gap: 6px; }
  .topbar .status .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); display: inline-block; }
  .topbar .status .model { font-family: monospace; font-size: 11px; }

  /* ── Chat container ── */
  .chat-area {
    flex: 1; overflow-y: auto; padding: 0;
    scroll-behavior: smooth;
  }
  .chat-area::-webkit-scrollbar { width: 6px; }
  .chat-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  .chat-area::-webkit-scrollbar-track { background: transparent; }

  .messages { max-width: 720px; margin: 0 auto; padding: 20px 20px 0; }

  /* ── Empty state ── */
  .empty-state {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 60vh; text-align: center; color: var(--dim);
  }
  .empty-state h2 { font-size: 28px; color: var(--text); margin-bottom: 8px; }
  .empty-state .logo { font-size: 48px; margin-bottom: 16px; }
  .empty-state p { font-size: 14px; max-width: 400px; line-height: 1.6; }

  /* ── Message bubbles ── */
  .msg-row {
    display: flex; gap: 12px; margin-bottom: 20px; align-items: flex-start;
  }
  .msg-row.user { flex-direction: row-reverse; }

  .msg-avatar {
    width: 32px; height: 32px; border-radius: 6px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 600; margin-top: 4px;
  }
  .msg-avatar.user-av { background: var(--accent); color: #fff; }
  .msg-avatar.bot-av { background: #333; color: var(--accent); }

  .msg-body { max-width: 85%; }

  .msg-header {
    display: flex; align-items: center; gap: 8px; margin-bottom: 4px;
    font-size: 13px; color: var(--text);
  }
  .msg-header .name { font-weight: 500; }
  .msg-header .time { font-size: 11px; color: var(--dim); }
  .msg-row.user .msg-header { flex-direction: row-reverse; }

  .msg-content {
    padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.6;
    white-space: pre-wrap; word-break: break-word;
  }
  .msg-row.user .msg-content {
    background: var(--accent); color: #fff;
    border-bottom-right-radius: 2px;
  }
  .msg-row.assistant .msg-content {
    background: var(--surface); border: 1px solid var(--border);
    border-bottom-left-radius: 2px;
  }

  .msg-content.typing::after {
    content: '...'; animation: dots 1.5s steps(4) infinite;
  }
  @keyframes dots { 0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; } 75% { content: '...'; } }

  /* ── Input ── */
  .input-area { flex-shrink: 0; padding: 0 20px 20px; background: var(--bg); }
  .input-wrap {
    max-width: 720px; margin: 0 auto;
    background: var(--input-bg); border: 1px solid var(--border);
    border-radius: 14px; padding: 4px; display: flex; align-items: flex-end;
    transition: border-color 0.15s;
  }
  .input-wrap:focus-within { border-color: var(--accent); }
  .input-wrap textarea {
    flex: 1; background: transparent; border: none; outline: none;
    color: var(--text); font-size: 14px; padding: 10px 12px;
    font-family: inherit; resize: none; max-height: 200px; line-height: 1.4;
  }
  .input-wrap textarea::placeholder { color: var(--dim); }
  .input-wrap button {
    background: var(--accent); color: #fff; border: none;
    width: 34px; height: 34px; border-radius: 10px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    margin: 6px; flex-shrink: 0; transition: background 0.15s;
  }
  .input-wrap button:hover { background: var(--accent-hover); }
  .input-wrap button:disabled { opacity: 0.3; cursor: not-allowed; }
  .input-wrap button svg { width: 18px; height: 18px; }
  .input-hint { max-width: 720px; margin: 6px auto 0; font-size: 11px; color: var(--dim); text-align: center; }

  /* ── New chat button ── */
  .new-chat-btn {
    position: fixed; bottom: 100px; right: 24px;
    background: var(--accent); color: #fff; border: none;
    width: 44px; height: 44px; border-radius: 50%; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 12px rgba(0,0,0,0.3); transition: background 0.15s; z-index: 10;
  }
  .new-chat-btn:hover { background: var(--accent-hover); }
  .new-chat-btn svg { width: 20px; height: 20px; }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">🧿 <span>Dorina</span></div>
  <div class="status">
    <span class="dot"></span>
    <span class="model" id="modelName">yükleniyor...</span>
  </div>
</div>

<div class="chat-area" id="chatArea">
  <div class="messages" id="messages">
    <div class="empty-state" id="emptyState">
      <div class="logo">🧿</div>
      <h2>Dorina</h2>
      <p>Merhaba! Bana bir soru sorabilir, bir şeyler yazmamı isteyebilir veya bir dosyayı incelememi söyleyebilirsin.</p>
    </div>
  </div>
</div>

<button class="new-chat-btn" id="newChatBtn" title="Yeni sohbet" onclick="newChat()">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <path d="M12 5v14M5 12h14"/>
  </svg>
</button>

<div class="input-area">
  <div class="input-wrap">
    <textarea id="msgInput" rows="1" placeholder="Mesaj yaz..." autofocus></textarea>
    <button id="sendBtn" onclick="sendMessage()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
      </svg>
    </button>
  </div>
  <div class="input-hint" id="hint"></div>
</div>

<script>
let ws = null, sessionId = '', isWaiting = false, typingRow = null;

const chatArea = document.getElementById('chatArea');
const messages = document.getElementById('messages');
const emptyState = document.getElementById('emptyState');
const msgInput = document.getElementById('msgInput');
const sendBtn = document.getElementById('sendBtn');
const hint = document.getElementById('hint');
const modelName = document.getElementById('modelName');

msgInput.addEventListener('input', () => {
  msgInput.style.height = 'auto';
  msgInput.style.height = Math.min(msgInput.scrollHeight, 200) + 'px';
});
msgInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});

loadStatus();
connectWS();
msgInput.focus();

// ── WebSocket ──
function connectWS() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws/chat`);
  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    switch (msg.type) {
      case 'session': sessionId = msg.session_id; break;
      case 'user': addMessage('user', msg.content); break;
      case 'assistant':
        if (msg.done) {
          if (typingRow) {
            const content = typingRow.querySelector('.msg-content');
            content.textContent = msg.content;
            content.classList.remove('typing');
            typingRow = null;
          } else {
            addMessage('assistant', msg.content);
          }
          isWaiting = false; updateSendBtn(); scrollBottom();
        }
        break;
      case 'error':
        if (typingRow) {
          const content = typingRow.querySelector('.msg-content');
          content.textContent = '❌ ' + msg.content;
          content.classList.remove('typing');
          typingRow = null;
        }
        isWaiting = false; updateSendBtn(); scrollBottom();
        break;
    }
  };
  ws.onclose = () => { if (!isWaiting) setTimeout(connectWS, 3000); };
  ws.onerror = () => ws.close();
}

// ── Send ──
function sendMessage() {
  const text = msgInput.value.trim();
  if (!text || isWaiting) return;
  if (emptyState) emptyState.remove();

  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ query: text }));
    msgInput.value = ''; msgInput.style.height = 'auto';
    isWaiting = true; updateSendBtn();

    typingRow = addMessage('assistant', '');
    const content = typingRow.querySelector('.msg-content');
    content.classList.add('typing');
    scrollBottom();
  }
}

// ── New chat ──
function newChat() {
  if (isWaiting) return;
  messages.querySelectorAll('.msg-row').forEach(el => el.remove());
  if (!emptyState) {
    const es = document.createElement('div');
    es.className = 'empty-state'; es.id = 'emptyState';
    es.innerHTML = '<div class="logo">🧿</div><h2>Dorina</h2><p>Merhaba! Bana bir soru sorabilir, bir şeyler yazmamı isteyebilir veya bir dosyayı incelememi söyleyebilirsin.</p>';
    messages.prepend(es);
  }
  sessionId = ''; ws && ws.close(); connectWS();
}

// ── Message render ──
function addMessage(role, content) {
  const row = document.createElement('div');
  row.className = `msg-row ${role}`;

  // Avatar
  const avatar = document.createElement('div');
  avatar.className = `msg-avatar ${role === 'user' ? 'user-av' : 'bot-av'}`;
  avatar.textContent = role === 'user' ? 'S' : 'D';
  row.appendChild(avatar);

  // Body
  const body = document.createElement('div');
  body.className = 'msg-body';

  const header = document.createElement('div');
  header.className = 'msg-header';
  const name = document.createElement('span');
  name.className = 'name';
  name.textContent = role === 'user' ? 'Siz' : 'Dorina';
  header.appendChild(name);
  const time = document.createElement('span');
  time.className = 'time';
  time.textContent = new Date().toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });
  header.appendChild(time);
  body.appendChild(header);

  const bubble = document.createElement('div');
  bubble.className = 'msg-content';
  bubble.textContent = content;
  body.appendChild(bubble);

  row.appendChild(body);
  messages.appendChild(row);
  scrollBottom();
  return row;
}

function scrollBottom() { chatArea.scrollTop = chatArea.scrollHeight; }
function updateSendBtn() { sendBtn.disabled = isWaiting; }

async function loadStatus() {
  try {
    const res = await fetch('/api/status');
    const data = await res.json();
    modelName.textContent = data.model || '-';
  } catch(e) {
    modelName.textContent = 'bağlanamadı';
    setTimeout(loadStatus, 3000);
  }
}
</script>
</body>
</html>
