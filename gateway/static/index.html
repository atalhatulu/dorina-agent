<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Dorina</title>
<style>
  :root {
    --bg: #212121;
    --surface: #171717;
    --border: #333;
    --text: #e0e0e0;
    --dim: #888;
    --accent: #d4622a;
    --input-bg: #2a2a2a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg); color: var(--text);
    height: 100vh; display: flex; flex-direction: column; overflow: hidden;
  }
  .topbar {
    display: flex; align-items: center; padding: 12px 20px;
    border-bottom: 1px solid var(--border); background: var(--surface); flex-shrink: 0;
  }
  .topbar .brand { font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .topbar .brand span { color: var(--accent); }
  .topbar .status { margin-left: auto; font-size: 12px; color: var(--dim); display: flex; align-items: center; gap: 6px; }
  .topbar .status .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); display: inline-block; }
  .topbar .status .model { font-family: monospace; font-size: 11px; }
  .chat-area { flex: 1; overflow-y: auto; padding: 0; scroll-behavior: smooth; }
  .chat-area::-webkit-scrollbar { width: 6px; }
  .chat-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  .chat-area::-webkit-scrollbar-track { background: transparent; }
  .messages { max-width: 720px; margin: 0 auto; padding: 20px 20px 80px; }
  .empty-state {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 60vh; text-align: center; color: var(--dim);
  }
  .empty-state h2 { font-size: 28px; color: var(--text); margin-bottom: 8px; }
  .empty-state .logo { font-size: 48px; margin-bottom: 16px; }
  .empty-state p { font-size: 14px; max-width: 400px; line-height: 1.6; }

  .msg-row { display: flex; gap: 12px; margin-bottom: 20px; align-items: flex-start; }
  .msg-row.user { flex-direction: row-reverse; }
  .msg-avatar {
    width: 32px; height: 32px; border-radius: 6px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 600; margin-top: 4px;
  }
  .msg-avatar.av-user { background: var(--accent); color: #fff; }
  .msg-avatar.av-bot { background: #333; color: var(--accent); }
  .msg-body { max-width: 75%; }
  .msg-header {
    display: flex; align-items: center; gap: 8px; margin-bottom: 4px;
    font-size: 13px; color: var(--text);
  }
  .msg-row.user .msg-header { flex-direction: row-reverse; }
  .msg-header .name { font-weight: 500; }
  .msg-header .time { font-size: 11px; color: var(--dim); }
  .msg-bubble {
    padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.6;
    white-space: pre-wrap; word-break: break-word;
  }
  .msg-row.user .msg-bubble { background: var(--accent); color: #fff; border-bottom-right-radius: 2px; }
  .msg-row.assistant .msg-bubble { background: var(--surface); border: 1px solid var(--border); border-bottom-left-radius: 2px; }
  .msg-bubble.typing { min-width: 60px; }
  .msg-bubble.typing::after { content: '...'; animation: dots 1.5s steps(4) infinite; }
  @keyframes dots { 0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; } 75% { content: '...'; } }

  .input-area { flex-shrink: 0; padding: 0 20px 20px; background: var(--bg); position: sticky; bottom: 0; }
  .input-wrap {
    max-width: 720px; margin: 0 auto; background: var(--input-bg); border: 1px solid var(--border);
    border-radius: 14px; padding: 4px; display: flex; align-items: flex-end; transition: border-color 0.15s;
  }
  .input-wrap:focus-within { border-color: var(--accent); }
  .input-wrap textarea {
    flex: 1; background: transparent; border: none; outline: none;
    color: var(--text); font-size: 14px; padding: 10px 12px;
    font-family: inherit; resize: none; max-height: 200px; line-height: 1.4;
  }
  .input-wrap textarea::placeholder { color: var(--dim); }
  .input-wrap button {
    background: var(--accent); color: #fff; border: none;
    width: 34px; height: 34px; border-radius: 10px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    margin: 6px; flex-shrink: 0; transition: background 0.15s;
  }
  .input-wrap button:hover { background: var(--accent-hover); }
  .input-wrap button:disabled { opacity: 0.3; cursor: not-allowed; }
  .input-wrap button svg { width: 18px; height: 18px; }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">🧿 <span>Dorina</span></div>
  <div class="status"><span class="dot"></span><span class="model" id="modelName">yükleniyor...</span></div>
</div>

<div class="chat-area" id="chatArea">
  <div class="messages" id="messages">
    <div class="empty-state" id="emptyState">
      <div class="logo">🧿</div>
      <h2>Dorina</h2>
      <p>Merhaba! Bana bir soru sor.</p>
    </div>
  </div>
</div>

<div class="input-area">
  <div class="input-wrap">
    <textarea id="msgInput" rows="1" placeholder="Mesaj yaz..." autofocus></textarea>
    <button id="sendBtn" onclick="sendMessage()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
      </svg>
    </button>
  </div>
</div>

<script>
let ws = null, sessionId = '', isWaiting = false, typingRow = null;
const messages = document.getElementById('messages');
const emptyState = document.getElementById('emptyState');
const msgInput = document.getElementById('msgInput');
const sendBtn = document.getElementById('sendBtn');

msgInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});
loadStatus(); connectWS(); msgInput.focus();

function connectWS() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws/chat`);
  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    switch (msg.type) {
      case 'session': sessionId = msg.session_id; break;
      case 'user':
        // Kullanici mesaji geldi → altina typing indicator koy
        if (!isWaiting) break; // ignore stale echos
        typingRow = addBubble('assistant', '');
        typingRow.querySelector('.msg-bubble').classList.add('typing');
        scrollBottom();
        break;
      case 'assistant':
        if (msg.done) {
          if (typingRow) {
            typingRow.querySelector('.msg-bubble').textContent = msg.content;
            typingRow.querySelector('.msg-bubble').classList.remove('typing');
            typingRow = null;
          } else { addBubble('assistant', msg.content); }
          isWaiting = false; updateBtn(); scrollBottom();
        }
        break;
      case 'error':
        if (typingRow) {
          typingRow.querySelector('.msg-bubble').textContent = '❌ ' + msg.content;
          typingRow.querySelector('.msg-bubble').classList.remove('typing');
          typingRow = null;
        }
        isWaiting = false; updateBtn(); scrollBottom();
        break;
    }
  };
  ws.onclose = () => { if (!isWaiting) setTimeout(connectWS, 3000); };
  ws.onerror = () => ws.close();
}

function sendMessage() {
  const text = msgInput.value.trim();
  if (!text || isWaiting) return;
  if (emptyState) emptyState.remove();
  ws.send(JSON.stringify({ query: text }));
  msgInput.value = ''; msgInput.style.height = 'auto';
  isWaiting = true; updateBtn();
  // Kullanici mesajini hemen ekle (beklemeden)
  addBubble('user', text);
}

function addBubble(role, content) {
  const row = document.createElement('div');
  row.className = `msg-row ${role}`;
  const av = document.createElement('div');
  av.className = `msg-avatar av-${role === 'user' ? 'user' : 'bot'}`;
  av.textContent = role === 'user' ? 'S' : 'D';
  row.appendChild(av);
  const body = document.createElement('div');
  body.className = 'msg-body';
  const hdr = document.createElement('div');
  hdr.className = 'msg-header';
  const nm = document.createElement('span'); nm.className = 'name'; nm.textContent = role === 'user' ? 'Siz' : 'Dorina';
  hdr.appendChild(nm);
  const tm = document.createElement('span'); tm.className = 'time';
  tm.textContent = new Date().toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });
  hdr.appendChild(tm);
  body.appendChild(hdr);
  const bbl = document.createElement('div');
  bbl.className = 'msg-bubble';
  bbl.textContent = content;
  body.appendChild(bbl);
  row.appendChild(body);
  messages.appendChild(row);
  return row;
}

function scrollBottom() { document.getElementById('chatArea').scrollTop = document.getElementById('chatArea').scrollHeight; }
function updateBtn() { sendBtn.disabled = isWaiting; }

async function loadStatus() {
  try {
    const r = await fetch('/api/status'); const d = await r.json();
    document.getElementById('modelName').textContent = d.model || '-';
  } catch(e) { setTimeout(loadStatus, 3000); }
}
</script>
</body>
</html>
