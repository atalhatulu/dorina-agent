<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dorina Dashboard</title>
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --dim: #8b949e;
    --accent: #d4622a;
    --accent-hover: #e5753a;
    --green: #3fb950;
    --red: #f85149;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg); color: var(--text); height: 100vh; display: flex;
  }
  /* ── Sidebar ── */
  .sidebar {
    width: 280px; background: var(--surface); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; flex-shrink: 0;
  }
  .sidebar-header {
    padding: 16px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 10px;
  }
  .sidebar-header h1 { font-size: 16px; font-weight: 600; }
  .sidebar-header .version { font-size: 11px; color: var(--dim); }
  .status-dot {
    width: 8px; height: 8px; border-radius: 50%; background: var(--green); flex-shrink: 0;
  }
  .status-panel {
    padding: 12px 16px; border-bottom: 1px solid var(--border); font-size: 12px;
    display: grid; grid-template-columns: 1fr 1fr; gap: 4px 12px;
  }
  .status-panel .label { color: var(--dim); }
  .status-panel .value { color: var(--text); text-align: right; font-family: monospace; font-size: 11px; }
  .session-list { flex: 1; overflow-y: auto; padding: 8px 0; }
  .session-list .title-row {
    padding: 4px 16px; font-size: 11px; color: var(--dim); text-transform: uppercase;
    letter-spacing: 0.5px; display: flex; justify-content: space-between;
  }
  .session-item {
    padding: 8px 16px; cursor: pointer; border-left: 3px solid transparent;
    font-size: 13px; transition: all 0.15s;
  }
  .session-item:hover { background: rgba(255,255,255,0.05); }
  .session-item.active { border-left-color: var(--accent); background: rgba(212,98,42,0.08); }
  .session-item .s-title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .session-item .s-meta { font-size: 11px; color: var(--dim); margin-top: 2px; }

  /* ── Main ── */
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .chat-area { flex: 1; overflow-y: auto; padding: 16px 24px; }
  .welcome {
    text-align: center; margin-top: 20vh; color: var(--dim);
  }
  .welcome h2 { font-size: 24px; color: var(--text); margin-bottom: 8px; }
  .welcome p { font-size: 14px; }

  /* ── Messages ── */
  .msg { margin-bottom: 16px; max-width: 85%; }
  .msg.user { margin-left: auto; }
  .msg .bubble {
    padding: 10px 14px; border-radius: 8px; font-size: 14px; line-height: 1.5;
    white-space: pre-wrap; word-break: break-word;
  }
  .msg.user .bubble { background: var(--accent); color: #fff; border-bottom-right-radius: 2px; }
  .msg.assistant .bubble { background: var(--surface); border: 1px solid var(--border); border-bottom-left-radius: 2px; }
  .msg .sender { font-size: 11px; color: var(--dim); margin-bottom: 4px; padding: 0 4px; }
  .msg.user .sender { text-align: right; }
  .msg .timestamp { font-size: 10px; color: var(--dim); margin-top: 4px; padding: 0 4px; }
  .msg.user .timestamp { text-align: right; }

  /* ── Input ── */
  .input-area {
    padding: 12px 24px 16px; border-top: 1px solid var(--border); background: var(--surface);
  }
  .input-row { display: flex; gap: 8px; }
  .input-row input {
    flex: 1; background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
    padding: 10px 14px; color: var(--text); font-size: 14px; outline: none;
  }
  .input-row input:focus { border-color: var(--accent); }
  .input-row button {
    background: var(--accent); color: #fff; border: none; border-radius: 6px;
    padding: 10px 20px; font-size: 14px; cursor: pointer; font-weight: 500;
    transition: background 0.15s;
  }
  .input-row button:hover { background: var(--accent-hover); }
  .input-row button:disabled { opacity: 0.5; cursor: not-allowed; }
  .input-area .hint { font-size: 11px; color: var(--dim); margin-top: 6px; }

  /* ── Scrollbar ── */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  /* ── Responsive ── */
  @media (max-width: 768px) {
    .sidebar { display: none; }
  }
</style>
</head>
<body>

<!-- Sidebar -->
<div class="sidebar">
  <div class="sidebar-header">
    <span class="status-dot" id="statusDot"></span>
    <div>
      <h1>Dorina</h1>
      <span class="version" id="version">v? yükleniyor...</span>
    </div>
  </div>
  <div class="status-panel" id="statusPanel">
    <span class="label">Model</span><span class="value" id="sModel">-</span>
    <span class="label">Provider</span><span class="value" id="sProvider">-</span>
    <span class="label">Modlar</span><span class="value" id="sModes">-</span>
    <span class="label">Session</span><span class="value" id="sSessionCount">-</span>
  </div>
  <div class="session-list" id="sessionList">
    <div class="title-row"><span>Session'lar</span><span id="sSessionCount2"></span></div>
    <div id="sessionItems"></div>
  </div>
</div>

<!-- Main -->
<div class="main">
  <div class="chat-area" id="chatArea">
    <div class="welcome" id="welcome">
      <h2>🧿 Dorina Dashboard</h2>
      <p>Ajan'a bir mesaj gönder veya sol panelden session seç.</p>
    </div>
  </div>
  <div class="input-area">
    <div class="input-row">
      <input type="text" id="msgInput" placeholder="Mesajınızı yazın..." autofocus>
      <button id="sendBtn" onclick="sendMessage()">Gönder</button>
    </div>
    <div class="hint" id="hint">Yeni bir sohbet başlatmak için mesaj yazın.</div>
  </div>
</div>

<script>
// ── State ──
let ws = null;
let sessionId = '';
let messages = [];
let isWaiting = false;

// ── DOM refs ──
const chatArea = document.getElementById('chatArea');
const welcome = document.getElementById('welcome');
const msgInput = document.getElementById('msgInput');
const sendBtn = document.getElementById('sendBtn');
const hint = document.getElementById('hint');
const sessionItems = document.getElementById('sessionItems');

// ── Init ──
loadStatus();
loadSessions();
connectWS();

msgInput.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } });

// ── WebSocket ──
function connectWS() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws/chat`);

  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    switch (msg.type) {
      case 'session':
        sessionId = msg.session_id;
        updateHint(`Session: ${sessionId.slice(0,12)}...`);
        break;
      case 'user':
        addMessage('user', msg.content);
        break;
      case 'assistant':
        addMessage('assistant', msg.content);
        if (msg.done) isWaiting = false;
        updateSendBtn();
        scrollBottom();
        break;
      case 'error':
        addMessage('assistant', '❌ ' + msg.content);
        isWaiting = false;
        updateSendBtn();
        break;
    }
  };

  ws.onclose = () => { setTimeout(connectWS, 2000); };
  ws.onerror = () => { ws.close(); };
}

// ── Send ──
function sendMessage() {
  const text = msgInput.value.trim();
  if (!text || isWaiting) return;

  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ query: text }));
    msgInput.value = '';
    isWaiting = true;
    updateSendBtn();
  } else {
    addMessage('assistant', '⚠️ Sunucuya bağlanılamadı. Sayfayı yenileyin.');
  }
}

// ── UI helpers ──
function addMessage(role, content) {
  welcome && welcome.remove();

  const div = document.createElement('div');
  div.className = `msg ${role}`;

  const sender = document.createElement('div');
  sender.className = 'sender';
  sender.textContent = role === 'user' ? 'Siz' : 'Dorina';
  div.appendChild(sender);

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = content;
  div.appendChild(bubble);

  const ts = document.createElement('div');
  ts.className = 'timestamp';
  ts.textContent = new Date().toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });
  div.appendChild(ts);

  chatArea.appendChild(div);
  scrollBottom();
}

function scrollBottom() {
  chatArea.scrollTop = chatArea.scrollHeight;
}

function updateSendBtn() {
  sendBtn.disabled = isWaiting;
  sendBtn.textContent = isWaiting ? 'Yanıt bekleniyor...' : 'Gönder';
}

function updateHint(text) {
  hint.textContent = text;
}

// ── REST API ──
async function loadStatus() {
  try {
    const res = await fetch('/api/status');
    const data = await res.json();
    document.getElementById('version').textContent = 'v' + data.version;
    document.getElementById('sModel').textContent = data.model || '-';
    document.getElementById('sProvider').textContent = data.provider || '-';
    document.getElementById('sModes').textContent = (data.modes || []).join(', ') || 'normal';
    document.getElementById('sSessionCount').textContent = data.sessions.total;
    document.getElementById('sSessionCount2').textContent = data.sessions.total;
    document.getElementById('statusDot').style.background =
      data.sessions.active_id ? 'var(--green)' : 'var(--dim)';
  } catch(e) { /* retry */ setTimeout(loadStatus, 3000); }
}

async function loadSessions() {
  try {
    const res = await fetch('/api/sessions?limit=30');
    const data = await res.json();
    sessionItems.innerHTML = data.sessions.map(s => `
      <div class="session-item${s.id === sessionId ? ' active' : ''}"
           onclick="selectSession('${s.id}')">
        <div class="s-title">${escapeHtml(s.title || 'İsimsiz')}</div>
        <div class="s-meta">${s.message_count || 0} mesaj · ${timeAgo(s.updated_at || s.created_at)}</div>
      </div>
    `).join('');
  } catch(e) { setTimeout(loadSessions, 5000); }
  setTimeout(loadSessions, 10000);
}

async function selectSession(id) {
  const res = await fetch(`/api/sessions/${id}`);
  const data = await res.json();
  sessionId = id;
  chatArea.innerHTML = '';
  welcome && welcome.remove();

  if (data.messages) {
    for (const m of data.messages) {
      const role = m.role === 'user' ? 'user' : 'assistant';
      const content = m.content || '';
      if (content) addMessage(role, content);
    }
  }
  loadSessions();
}

// ── Util ──
function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}

function timeAgo(ts) {
  if (!ts) return '';
  const sec = (Date.now() - new Date(ts).getTime()) / 1000;
  if (sec < 60) return 'az önce';
  if (sec < 3600) return `${Math.floor(sec/60)} dk önce`;
  if (sec < 86400) return `${Math.floor(sec/3600)} s önce`;
  return `${Math.floor(sec/86400)} g önce`;
}
</script>
</body>
</html>
