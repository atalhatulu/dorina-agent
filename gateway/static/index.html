<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dorina</title>
<style>
  :root {
    --bg: #212121;
    --surface: #171717;
    --border: #333;
    --text: #e0e0e0;
    --dim: #888;
    --accent: #d4622a;
    --accent-hover: #e5753a;
    --user-msg: #2d2d2d;
    --bot-msg: #1a1a1a;
    --input-bg: #2a2a2a;
    --shadow: rgba(0,0,0,0.3);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg); color: var(--text);
    height: 100vh; display: flex; flex-direction: column;
    overflow: hidden;
  }

  /* ── Top bar ── */
  .topbar {
    display: flex; align-items: center; padding: 10px 20px;
    border-bottom: 1px solid var(--border); background: var(--surface);
    flex-shrink: 0;
  }
  .topbar .brand { font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .topbar .brand span { color: var(--accent); }
  .topbar .status { margin-left: auto; font-size: 12px; color: var(--dim); display: flex; align-items: center; gap: 6px; }
  .topbar .status .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); display: inline-block; }
  .topbar .status .model { font-family: monospace; font-size: 11px; }

  /* ── Chat area ── */
  .chat-area {
    flex: 1; overflow-y: auto; padding: 0;
    scroll-behavior: smooth;
  }
  .chat-area::-webkit-scrollbar { width: 6px; }
  .chat-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  .chat-area::-webkit-scrollbar-track { background: transparent; }

  .messages { max-width: 720px; margin: 0 auto; padding: 20px 20px 0; }

  .empty-state {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 60vh; text-align: center; color: var(--dim);
  }
  .empty-state h2 { font-size: 28px; color: var(--text); margin-bottom: 8px; }
  .empty-state .logo { font-size: 48px; margin-bottom: 16px; }
  .empty-state p { font-size: 14px; max-width: 400px; line-height: 1.6; }

  .msg-group { margin-bottom: 6px; }
  .msg { padding: 12px 16px; line-height: 1.6; font-size: 14px; white-space: pre-wrap; word-break: break-word; }
  .msg.user { color: var(--text); }
  .msg.assistant { color: var(--text); }
  .msg.system { color: var(--dim); font-style: italic; font-size: 13px; text-align: center; padding: 8px; }
  .msg.typing { color: var(--dim); }
  .msg.typing .dots::after { content: '...'; animation: dots 1.5s steps(4, end) infinite; }
  @keyframes dots { 0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; } 75% { content: '...'; } }

  .msg-header {
    display: flex; align-items: center; gap: 6px; margin-bottom: 4px;
    font-size: 12px; color: var(--dim);
  }
  .msg-header .avatar {
    width: 24px; height: 24px; border-radius: 4px;
    display: flex; align-items: center; justify-content: center; font-size: 13px;
  }
  .msg-header .avatar.user-av { background: var(--accent); color: #fff; }
  .msg-header .avatar.bot-av { background: #333; color: var(--accent); }
  .msg-header .name { font-weight: 500; }
  .msg-header .time { margin-left: auto; font-size: 11px; }

  /* ── Input area ── */
  .input-area {
    flex-shrink: 0; padding: 0 20px 20px; background: var(--bg);
  }
  .input-wrap {
    max-width: 720px; margin: 0 auto;
    background: var(--input-bg); border: 1px solid var(--border);
    border-radius: 12px; padding: 4px; display: flex; align-items: flex-end;
    transition: border-color 0.15s;
  }
  .input-wrap:focus-within { border-color: var(--accent); }
  .input-wrap textarea {
    flex: 1; background: transparent; border: none; outline: none;
    color: var(--text); font-size: 14px; padding: 10px 12px;
    font-family: inherit; resize: none; max-height: 200px; line-height: 1.4;
  }
  .input-wrap textarea::placeholder { color: var(--dim); }
  .input-wrap button {
    background: var(--accent); color: #fff; border: none;
    width: 32px; height: 32px; border-radius: 8px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    margin: 6px; flex-shrink: 0; transition: background 0.15s;
  }
  .input-wrap button:hover { background: var(--accent-hover); }
  .input-wrap button:disabled { opacity: 0.3; cursor: not-allowed; }
  .input-wrap button svg { width: 18px; height: 18px; }

  .input-hint {
    max-width: 720px; margin: 6px auto 0;
    font-size: 11px; color: var(--dim); text-align: center;
  }

  /* ── New chat button ── */
  .new-chat-btn {
    position: fixed; bottom: 100px; right: 24px;
    background: var(--accent); color: #fff; border: none;
    width: 44px; height: 44px; border-radius: 50%;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 12px var(--shadow); transition: background 0.15s;
    z-index: 10;
  }
  .new-chat-btn:hover { background: var(--accent-hover); }
  .new-chat-btn svg { width: 20px; height: 20px; }
</style>
</head>
<body>

<!-- Top bar -->
<div class="topbar">
  <div class="brand">🧿 <span>Dorina</span></div>
  <div class="status">
    <span class="dot"></span>
    <span class="model" id="modelName">yükleniyor...</span>
  </div>
</div>

<!-- Chat area -->
<div class="chat-area" id="chatArea">
  <div class="messages" id="messages">
    <div class="empty-state" id="emptyState">
      <div class="logo">🧿</div>
      <h2>Dorina</h2>
      <p>Merhaba! Bana bir soru sorabilir, bir şeyler yazmamı isteyebilir veya bir dosyayı incelememi söyleyebilirsin.</p>
    </div>
  </div>
</div>

<!-- New chat button -->
<button class="new-chat-btn" id="newChatBtn" title="Yeni sohbet" onclick="newChat()">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <path d="M12 5v14M5 12h14"/>
  </svg>
</button>

<!-- Input -->
<div class="input-area">
  <div class="input-wrap">
    <textarea id="msgInput" rows="1" placeholder="Mesaj yaz..." autofocus></textarea>
    <button id="sendBtn" onclick="sendMessage()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
      </svg>
    </button>
  </div>
  <div class="input-hint" id="hint"></div>
</div>

<script>
// ── State ──
let ws = null;
let sessionId = '';
let isWaiting = false;
let currentStreamMsg = null; // div element for streaming
let messageCount = 0;

// ── DOM ──
const chatArea = document.getElementById('chatArea');
const messages = document.getElementById('messages');
const emptyState = document.getElementById('emptyState');
const msgInput = document.getElementById('msgInput');
const sendBtn = document.getElementById('sendBtn');
const hint = document.getElementById('hint');
const modelName = document.getElementById('modelName');

// ── Auto-resize textarea ──
msgInput.addEventListener('input', () => {
  msgInput.style.height = 'auto';
  msgInput.style.height = Math.min(msgInput.scrollHeight, 200) + 'px';
});

msgInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

// ── Init ──
loadStatus();
connectWS();
msgInput.focus();

// ── WebSocket ──
function connectWS() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws/chat`);

  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    switch (msg.type) {
      case 'session':
        sessionId = msg.session_id;
        break;
      case 'user':
        addMessage('user', msg.content);
        messageCount++;
        break;
      case 'assistant':
        if (msg.done) {
          if (currentStreamMsg) {
            currentStreamMsg.textContent = msg.content;
            currentStreamMsg.classList.remove('typing');
            currentStreamMsg = null;
          } else {
            addMessage('assistant', msg.content);
          }
          isWaiting = false;
          updateSendBtn();
          scrollBottom();
        } else {
          // Streaming in progress - handled by middleware or full response
        }
        break;
      case 'error':
        if (currentStreamMsg) {
          currentStreamMsg.textContent = '❌ ' + msg.content;
          currentStreamMsg.classList.remove('typing');
          currentStreamMsg = null;
        } else {
          addMessage('assistant', '❌ ' + msg.content);
        }
        isWaiting = false;
        updateSendBtn();
        scrollBottom();
        break;
    }
  };

  ws.onclose = () => {
    if (!isWaiting) setTimeout(connectWS, 3000);
  };
  ws.onerror = () => { ws.close(); };
}

// ── Send ──
function sendMessage() {
  const text = msgInput.value.trim();
  if (!text || isWaiting) return;

  // Clear empty state
  if (emptyState) emptyState.remove();

  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ query: text }));
    msgInput.value = '';
    msgInput.style.height = 'auto';
    isWaiting = true;
    updateSendBtn();

    // Show typing indicator
    addMessage('assistant', '');
    currentStreamMsg = messages.lastElementChild?.querySelector('.msg');
    if (currentStreamMsg) {
      currentStreamMsg.classList.add('typing');
      currentStreamMsg.innerHTML = '<span class="dots"></span>';
    }
    scrollBottom();
  } else {
    addMessage('system', '⚠️ Sunucuya bağlanılamadı. Sayfayı yenileyin.');
  }
}

// ── New chat ──
function newChat() {
  if (isWaiting) return;
  messages.querySelectorAll('.msg-group').forEach(el => el.remove());
  if (!emptyState) {
    const es = document.createElement('div');
    es.className = 'empty-state';
    es.id = 'emptyState';
    es.innerHTML = '<div class="logo">🧿</div><h2>Dorina</h2><p>Merhaba! Bana bir soru sorabilir, bir şeyler yazmamı isteyebilir veya bir dosyayı incelememi söyleyebilirsin.</p>';
    messages.prepend(es);
  }
  messageCount = 0;
  sessionId = '';
  // Reconnect to get new session
  ws && ws.close();
  connectWS();
}

// ── UI ──
function addMessage(role, content) {
  const group = document.createElement('div');
  group.className = 'msg-group';

  const header = document.createElement('div');
  header.className = 'msg-header';

  const avatar = document.createElement('div');
  avatar.className = `avatar ${role === 'user' ? 'user-av' : 'bot-av'}`;
  avatar.textContent = role === 'user' ? 'S' : 'D';
  header.appendChild(avatar);

  const name = document.createElement('span');
  name.className = 'name';
  name.textContent = role === 'user' ? 'Siz' : 'Dorina';
  header.appendChild(name);

  const time = document.createElement('span');
  time.className = 'time';
  time.textContent = new Date().toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });
  header.appendChild(time);

  group.appendChild(header);

  const msg = document.createElement('div');
  msg.className = `msg ${role}`;
  if (content) msg.textContent = content;
  group.appendChild(msg);

  // Check if last group is same role and merge
  const lastGroup = messages.lastElementChild;
  if (lastGroup && lastGroup.querySelector('.msg')?.className?.includes(role) && role !== 'system') {
    // Just add content to last message
    const lastMsg = lastGroup.querySelector('.msg');
    if (content) lastMsg.textContent = lastMsg.textContent + '\n' + content;
    return;
  }

  messages.appendChild(group);
  return group;
}

function scrollBottom() {
  chatArea.scrollTop = chatArea.scrollHeight;
}

function updateSendBtn() {
  sendBtn.disabled = isWaiting;
}

// ── Status ──
async function loadStatus() {
  try {
    const res = await fetch('/api/status');
    const data = await res.json();
    modelName.textContent = data.model || '-';
  } catch(e) {
    modelName.textContent = 'bağlanamadı';
    setTimeout(loadStatus, 3000);
  }
}
</script>
</body>
</html>
